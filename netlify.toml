# Netlify configuration for the documentation site.
[build]
  command = "corepack enable && pnpm install && pnpm docs:build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

# VitePress emits clean URLs; serve the 404 page for unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
